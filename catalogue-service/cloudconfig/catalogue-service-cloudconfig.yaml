spring:
  boot:
    admin:
      client:
        enabled: false
  datasource:
    url: jdbc:postgresql://db_catalogue:5433/store
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true

  flyway:
    schemas:
      - public
      - catalogue

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://172.17.0.1:8082/realms/selmag
      client:
        registration:
          keycloak:
            client-id: catalogue-service-metrics-client
            client-secret: "**********"
            authorization-grant-type: client_credentials
            scope:
              - metrics_server
        provider:
          keycloak:
            issuer-uri: http://172.17.0.1:8082/realms/selmag

logging:
  level:
    sql: info

keycloak:
  uri: http://172.17.0.1:8082

springdoc:
  swagger-ui:
    oauth:
      client-id: swagger-app
      use-pkce-with-authorization-code-grant: true

management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'
  zipkin:
    tracing:
      endpoint: http://172.17.0.1:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0

eureka:
  client:
    service-url:
      defaultZone: http://172.17.0.1:8761/eureka/
  instance:
    prefer-ip-address: true